<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta id="themeColor" name="theme-color" content="#090d17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Codex Meter" />  <meta name="description" content="Codexの利用枠を確認するシンプルなPWA" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Codex Meter</title>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CODEX USAGE</p>
        <h1>Codex Meter</h1>
      </div>

      <button id="refreshButton" class="refresh-button" type="button" aria-label="最新データを再読み込み" title="更新">
        <span aria-hidden="true">↻</span>
      </button>
    </header>

    <section class="summary-panel" aria-label="Codex利用枠">
      <div class="meta-row">
        <span id="planBadge" class="plan-badge" hidden></span>
        <span id="updatedAt" class="updated-at">--</span>
      </div>

      <div id="limitGrid" class="limit-grid" aria-live="polite">
        <article class="limit-card skeleton" aria-hidden="true"></article>
        <article class="limit-card skeleton" aria-hidden="true"></article>
      </div>
    </section>

    <footer class="page-footer">
      <div class="theme-switcher" role="group" aria-label="カラーパターン">
        <button class="theme-button" type="button" data-theme-choice="dark" aria-pressed="true">
          <span class="theme-dot theme-dot-dark" aria-hidden="true"></span>
          <span>ミッドナイト</span>
        </button>
        <button class="theme-button" type="button" data-theme-choice="light" aria-pressed="false">
          <span class="theme-dot theme-dot-light" aria-hidden="true"></span>
          <span>ライト</span>
        </button>
        <button class="theme-button" type="button" data-theme-choice="aurora" aria-pressed="false">
          <span class="theme-dot theme-dot-aurora" aria-hidden="true"></span>
          <span>オーロラ</span>
        </button>
      </div>
    </footer>
  </main>

  <template id="limitCardTemplate">
    <article class="limit-card">
      <div class="card-topline">
        <div>
          <p class="limit-kicker"></p>
          <h2 class="limit-title"></h2>
        </div>
        <span class="window-badge"></span>
      </div>

      <div class="percentage-row">
        <strong class="remaining-value"></strong>
        <span class="remaining-unit">%</span>
      </div>

      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill"></div>
      </div>

      <div class="card-details">
        <div>
          <span>使用済み</span>
          <strong class="used-value"></strong>
        </div>
        <div>
          <span>リセット</span>
          <strong class="reset-value"></strong>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
